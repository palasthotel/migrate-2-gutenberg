name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: migrate-2-gutenberg
      dev-plugin-name: Migrate 2 Gutenberg - DEV
      # Requires PHP: 8.2 - every minor version from there up
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      # The plugin is not on wordpress.org; switch this on if it is ever submitted
      plugin-check: false
